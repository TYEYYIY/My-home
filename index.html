<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>مخزون المنزل</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
*{box-sizing:border-box}
#app{max-width:900px;margin:0 auto;padding:12px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e2e8f0;margin-bottom:12px}
.hd h1{font-size:18px;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:9px 16px;border-radius:99px;border:1px solid #e2e8f0;background:#fff;font-size:14px;cursor:pointer;color:#64748b}
.tabs button.on{background:#0d9488;color:#fff;border-color:#0d9488}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;border-right:4px solid #16a34a}
.card.low{border-right-color:#f59e0b}
.card.out{border-right-color:#dc2626}
.card h3{margin:0 0 6px;font-size:15px}
.card .qty{font-size:22px;font-weight:bold}
.card .meta{font-size:11px;color:#64748b;margin:4px 0 8px}
.card .row{display:flex;gap:6px}
.card .row button{flex:1;padding:7px;border-radius:8px;border:0;font-weight:bold;font-size:13px;cursor:pointer}
.btn-in{background:#dcfce7;color:#16a34a}
.btn-out{background:#fee2e2;color:#dc2626}
.btn-gray{background:#f1f5f9;color:#334155}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat div{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:#64748b}
.fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;border:0;background:#0d9488;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(13,148,136,.4)}
.fld{display:block;margin-bottom:10px;font-size:13px;color:#475569;font-weight:bold}
.fld input,.fld select{width:100%;padding:9px 11px;margin-top:4px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 14px;font-size:16px}
.modal .actions{display:flex;gap:8px;margin-top:12px}
.modal .actions button{flex:1;padding:10px;border-radius:8px;border:0;font-weight:bold;cursor:pointer}
.btn-primary{background:#0d9488;color:#fff}
.btn-close{background:#f1f5f9;color:#334155}
.alert{padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px}
.row-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px}
.row-item .info{flex:1;min-width:0}
.row-item .info b{display:block;font-size:14px}
.row-item .info small{color:#64748b;font-size:11px}
.row-item input{width:80px;padding:7px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-size:14px}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px}
.log-item{display:flex;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px}
.log-item .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.log-item .body{flex:1;min-width:0}
.log-item .body b{font-size:13px;display:block}
.log-item .body small{font-size:11px;color:#64748b;display:block}
.log-item .val{font-weight:bold;font-size:13px;white-space:nowrap}
.ic.in{background:#dcfce7;color:#16a34a}
.ic.out{background:#fee2e2;color:#dc2626}
.ic.adj{background:#fef3c7;color:#d97706}
.ic.del{background:#fee2e2;color:#dc2626}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;z-index:200;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 20px;color:#64748b;border:2px dashed #cbd5e1;border-radius:12px;font-size:13px}
</style>
<!-- مكتبات Firebase للمزامنة -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="errbar" style="display:none;position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:10px;z-index:9999;text-align:center;font-size:13px"></div>

<div id="app" style="display:none">
  <div class="hd">
    <h1>مخزون المنزل</h1>
    <button onclick="App.toggleTheme()" id="themeBtn" style="padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer">الوضع الليلي</button>
  </div>

  <div class="tabs">
    <button class="on" data-tab="stock" onclick="App.tab('stock')">المخزون</button>
    <button data-tab="audit" onclick="App.tab('audit')">الجرد</button>
    <button data-tab="log" onclick="App.tab('log')">السجل</button>
    <button data-tab="stats" onclick="App.tab('stats')">التقارير</button>
    <button data-tab="settings" onclick="App.tab('settings')">⚙️ الإعدادات</button>
  </div>

  <div id="screen-stock"></div>
  <div id="screen-audit" style="display:none"></div>
  <div id="screen-log" style="display:none"></div>
  <div id="screen-stats" style="display:none"></div>
  <div id="screen-settings" style="display:none"></div>

  <button class="fab" onclick="App.newItem()" title="إضافة صنف">+</button>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)App.closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ======== إعدادات المزامنة السحابية ========
// ضع هنا الرابط الذي نسخته من Firebase
const FIREBASE_URL = "https://home-inventory-c4e36-default-rtdb.firebaseio.com/"; 
// ==========================================

window.onerror = function(msg, src, line){
  var bar = document.getElementById('errbar');
  if(bar){ bar.style.display = 'block'; bar.textContent = 'خطأ: ' + msg + ' (سطر ' + line + ')'; }
  return false;
};

// تشغيل Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log(err)); });
  var refreshing;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return; refreshing = true; window.location.reload();
  });
}

var App = (function(){
  var KEY = 'home_inv_v3';
  var APP_VERSION = '3.1.0';
  var UNITS = ['قطعة','كجم','جم','لتر','مل','علبة','كيس','زجاجة','عبوة','متر','صندوق','دستة','رول'];
  var DEF_CATS = ['مواد غذائية','منظفات','أدوات منزلية','عناية شخصية','أدوية','معلبات','مشروبات','بهارات','أخرى'];

  var state = { items: [], log: [], currency: 'ج.م', theme: 'light' };
  var audit = {};
  var ui = { cat: 'all', status: 'all', q: '', sort: 'name', logF: 'all' };

  // ---- متغيرات المزامنة ----
  var dbRef = null;
  var isSyncing = false;

  function esc(s){ if(s === null || s === undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function fmt(n){ n = num(n); return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function fmtDate(ts){ var d = new Date(ts), p = function(x){ return ('0'+x).slice(-2); }; return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.className = 'toast on';
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast'; }, 2200);
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('تعذر الحفظ'); }
    // إذا كنا متصلين، نرسل البيانات للسحابة
    if(dbRef && !isSyncing) {
      dbRef.set(state).catch(function(e){ console.log("Sync failed", e); });
    }
  }
  
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var p = JSON.parse(raw);
      if(p && typeof p === 'object'){
        state.items = Array.isArray(p.items) ? p.items : [];
        state.log = Array.isArray(p.log) ? p.log : [];
        state.currency = p.currency || 'ج.م';
        state.theme = p.theme || 'light';
      }
    } catch(e){ console.warn('load error', e); }
  }

  // ---- دوال المزامنة ----
  function initSync() {
    var syncCode = localStorage.getItem('sync_code');
    if(!syncCode || FIREBASE_URL.indexOf("YOUR-PROJECT-ID") !== -1) return;

    try {
      if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_URL });
      var db = firebase.database();
      dbRef = db.ref('inventory_sync/' + syncCode);

      // الاستماع لأي تغييرات من الهاتف الآخر
      dbRef.on('value', function(snapshot) {
        var data = snapshot.val();
        if (data) {
          isSyncing = true;
          state.items = Array.isArray(data.items) ? data.items : [];
          state.log = Array.isArray(data.log) ? data.log : [];
          state.currency = data.currency || 'ج.م';
          localStorage.setItem(KEY, JSON.stringify(state));
          renderAll();
          setTimeout(function(){ isSyncing = false; }, 500);
        }
      });
    } catch(e) { console.error("Firebase init error", e); }
  }

  function connectSync() {
    var code = prompt("أدخل كود المزامنة (مثال: 123456) لتوحيد البيانات بين هاتفيك:");
    if(!code) return;
    localStorage.setItem('sync_code', code.trim());
    toast("جاري ربط الجهاز...");
    setTimeout(function(){ window.location.reload(); }, 1500);
  }

  function disconnectSync() {
    if(!confirm("هل تريد إلغاء المزامنة مع الهاتف الآخر؟")) return;
    localStorage.removeItem('sync_code');
    toast("تم إلغاء المزامنة");
    setTimeout(function(){ window.location.reload(); }, 1000);
  }

  // ---- باقي دوال التطبيق ----
  function status(it){ var q = num(it.qty), m = num(it.minQty); if(q <= 0) return 'out'; if(m > 0 && q <= m) return 'low'; return 'ok'; }
  function findItem(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id === id) return state.items[i]; return null; }
  function pushLog(o){ var e = { id: uid(), at: Date.now(), note: '', price: 0 }; for(var k in o) if(Object.prototype.hasOwnProperty.call(o, k)) e[k] = o[k]; state.log.unshift(e); if(state.log.length > 3000) state.log.length = 3000; }

  function boot(){
    load();
    applyTheme();
    initSync(); // تشغيل المزامنة إذا كان الكود موجوداً
    
    if(!state.items.length && !state.log.length){
      var demo = [ { name:'أرز', category:'مواد غذائية', unit:'كجم', qty:5, minQty:2, price:35 }, { name:'سكر', category:'مواد غذائية', unit:'كجم', qty:1, minQty:2, price:28 }, { name:'زيت', category:'مواد غذائية', unit:'لتر', qty:3, minQty:1, price:65 }, { name:'صابون غسيل', category:'منظفات', unit:'علبة', qty:0, minQty:1, price:22 } ];
      for(var i=0;i<demo.length;i++){ demo[i].id = uid(); demo[i].createdAt = Date.now(); demo[i].note = ''; state.items.push(demo[i]); }
      save();
    }
    renderAll();
  }

  function renderAll(){
    try { renderStock(); } catch(e){ console.error(e); }
    try { renderAudit(); } catch(e){ console.error(e); }
    try { renderLog(); } catch(e){ console.error(e); }
    try { renderStats(); } catch(e){ console.error(e); }
    try { renderSettings(); } catch(e){ console.error(e); }
  }

  // ... (دوال الرندر Stock, Audit, Log, Stats كما هي في الكود السابق) ...
  function renderStock(){
    var totVal = 0, low = 0, out = 0;
    for(var i=0;i<state.items.length;i++){ var it = state.items[i]; totVal += num(it.qty) * num(it.price); var st = status(it); if(st === 'low') low++; if(st === 'out') out++; }
    var html = '<div class="stat"><div><b>'+state.items.length+'</b><span>الأصناف</span></div><div><b>'+fmt(totVal)+'</b><span>قيمة ('+esc(state.currency)+')</span></div><div><b style="color:#f59e0b">'+low+'</b><span>منخفض</span></div><div><b style="color:#dc2626">'+out+'</b><span>نافد</span></div></div>';
    html += '<div style="display:flex;gap:8px;margin-bottom:10px"><input id="searchBox" placeholder="ابحث..." value="'+esc(ui.q)+'" oninput="App.setSearch(this.value)" style="flex:1;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px"><select onchange="App.setSort(this.value)" style="padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;background:#fff"><option value="name"'+(ui.sort==='name'?' selected':'')+'>الاسم</option><option value="qty"'+(ui.sort==='qty'?' selected':'')+'>الأقل كمية</option><option value="value"'+(ui.sort==='value'?' selected':'')+'>الأعلى قيمة</option></select></div>';
    var sts = [ {k:'all',t:'الكل'}, {k:'ok',t:'متوفر'}, {k:'low',t:'منخفض'}, {k:'out',t:'نافد'} ];
    html += '<div style="display:flex;gap:6px;margin-bottom:8px;overflow-x:auto">';
    for(var s=0;s<sts.length;s++){ var x = sts[s]; html += '<button onclick="App.setStatus(\''+x.k+'\')" style="padding:6px 14px;border-radius:99px;border:1px solid #e2e8f0;background:'+(ui.status===x.k?'#0d9488':'#fff')+';color:'+(ui.status===x.k?'#fff':'#64748b')+';font-size:12px;white-space:nowrap;cursor:pointer">'+x.t+'</button>'; }
    html += '</div>';
    var seen = {}, cats = []; for(var c=0;c<state.items.length;c++){ var cc = state.items[c].category; if(cc && !seen[cc]){ seen[cc] = 1; cats.push(cc); } }
    if(cats.length){ html += '<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto"><button onclick="App.setCat(\'all\')" style="padding:6px 14px;border-radius:99px;border:1px solid #e2e8f0;background:'+(ui.cat==='all'?'#0d9488':'#fff')+';color:'+(ui.cat==='all'?'#fff':'#64748b')+';font-size:12px;white-space:nowrap;cursor:pointer">كل الفئات</button>'; for(var k=0;k<cats.length;k++){ html += '<button onclick="App.setCat(\''+esc(cats[k])+'\')" style="padding:6px 14px;border-radius:99px;border:1px solid #e2e8f0;background:'+(ui.cat===cats[k]?'#0d9488':'#fff')+';color:'+(ui.cat===cats[k]?'#fff':'#64748b')+';font-size:12px;white-space:nowrap;cursor:pointer">'+esc(cats[k])+'</button>'; } html += '</div>'; }
    var list = []; for(var n=0;n<state.items.length;n++){ var item = state.items[n]; if(ui.cat !== 'all' && item.category !== ui.cat) continue; if(ui.status !== 'all' && status(item) !== ui.status) continue; if(ui.q){ var hay = (item.name + ' ' + (item.category||'') + ' ' + (item.note||'')).toLowerCase(); if(hay.indexOf(ui.q) === -1) continue; } list.push(item); }
    list.sort(function(a, b){ if(ui.sort === 'name') return (a.name||'').localeCompare(b.name||''); if(ui.sort === 'qty') return num(a.qty) - num(b.qty); return (num(b.qty)*num(b.price)) - (num(a.qty)*num(a.price)); });
    if(!list.length){ html += '<div class="empty">' + (state.items.length ? 'لا توجد نتائج' : 'لا يوجد أصناف — اضغط زر + للإضافة') + '</div>'; } else { html += '<div class="cards">'; for(var m=0;m<list.length;m++){ var l = list[m]; var st2 = status(l); html += '<div class="card '+st2+'"><h3>'+esc(l.name)+'</h3><div class="qty">'+fmt(l.qty)+' <span style="font-size:12px;color:#64748b">'+esc(l.unit||'')+'</span></div><div class="meta">'+esc(l.category||'عام')+' • حد التنبيه: '+fmt(l.minQty) + (num(l.price)>0 ? ' • '+fmt(num(l.qty)*num(l.price))+' '+esc(state.currency) : '') + '</div><div class="row"><button class="btn-in" onclick="App.openOp(\''+l.id+'\',\'in\')">+ إضافة</button><button class="btn-out" onclick="App.openOp(\''+l.id+'\',\'out\')">− سحب</button><button class="btn-gray" onclick="App.openMenu(\''+l.id+'\')">⋯</button></div></div>'; } html += '</div>'; }
    $('screen-stock').innerHTML = html;
  }

  function renderAudit(){
    var html = '<div class="panel"><h3>جرد كامل</h3><p style="font-size:13px;color:#64748b;margin:0 0 10px">اكتب الكمية الفعلية لكل صنف، ثم اضغط «تطبيق الجرد» لتسجيل الفروقات.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="App.auditReset()" class="btn-close" style="padding:8px 12px;border-radius:8px;border:0;cursor:pointer">تفريغ</button><button onclick="App.auditFill()" class="btn-close" style="padding:8px 12px;border-radius:8px;border:0;cursor:pointer">ملء الحالي</button><button onclick="App.auditApply()" class="btn-primary" style="padding:8px 14px;border-radius:8px;border:0;cursor:pointer">تطبيق الجرد</button></div></div>';
    if(!state.items.length){ html += '<div class="empty">أضف أصنافاً أولاً</div>'; } else { var sorted = state.items.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); }); for(var i=0;i<sorted.length;i++){ var it = sorted[i]; var v = audit[it.id]; var diff = (v === undefined || v === '') ? '' : (num(v) - num(it.qty)); var dtxt = '', dcol = '#64748b'; if(diff !== ''){ dtxt = (diff > 0 ? '+' : '') + fmt(diff); dcol = diff > 0 ? '#16a34a' : diff < 0 ? '#dc2626' : '#64748b'; } html += '<div class="row-item"><div class="info"><b>'+esc(it.name)+'</b><small>'+esc(it.unit||'')+' • بالنظام: '+fmt(it.qty)+'</small></div><input type="number" step="any" data-audit="'+it.id+'" value="'+(v!==undefined ? esc(v) : '')+'" placeholder="الفعلي" oninput="App.auditInput(\''+it.id+'\',this.value)"><span style="font-size:12px;font-weight:bold;color:'+dcol+';min-width:44px;text-align:center" id="diff-'+it.id+'">'+dtxt+'</span></div>'; } }
    $('screen-audit').innerHTML = html;
  }

  function renderLog(){
    var fs = [ {k:'all',t:'الكل'}, {k:'in',t:'إضافات'}, {k:'out',t:'سحب'}, {k:'adjust',t:'جرد'} ];
    var html = '<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto">';
    for(var i=0;i<fs.length;i++){ var f = fs[i]; html += '<button onclick="App.setLogFilter(\''+f.k+'\')" style="padding:6px 14px;border-radius:99px;border:1px solid #e2e8f0;background:'+(ui.logF===f.k?'#0d9488':'#fff')+';color:'+(ui.logF===f.k?'#fff':'#64748b')+';font-size:12px;white-space:nowrap;cursor:pointer">'+f.t+'</button>'; }
    html += '</div>';
    var rows = []; for(var j=0;j<state.log.length;j++){ if(ui.logF === 'all' || state.log[j].type === ui.logF) rows.push(state.log[j]); }

  function checkForUpdates() {

    navigator.serviceWorker.getRegistration().then(function(reg) {
      if (!reg) { toast('لم يتم العثور على التطبيق.'); if (btn) { btn.textContent = 'البحث عن تحديثات'; btn.disabled = false; } return; }
      reg.update().then(function() {
        if (reg.waiting) { toast('تم العثور على تحديث! جاري التطبيق...'); reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } 
        else {
          reg.onupdatefound = function() {
            var installingWorker = reg.installing;
            installingWorker.onstatechange = function() {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                toast('تم العثور على تحديث! جاري إعادة التشغيل...'); installingWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            };
          };
          setTimeout(function() { if (btn) { btn.textContent = 'البحث عن تحديثات'; btn.disabled = false; } if (!reg.waiting) toast('أنت تستخدم أحدث إصدار ✅'); }, 2500);
        }
      }).catch(function(err) { console.error(err); toast('حدث خطأ أثناء البحث'); if (btn) { btn.textContent = 'البحث عن تحديثات'; btn.disabled = false; } });
    });
  }

  function tab(name){
    var btns = document.querySelectorAll('.tabs button'); for(var i=0;i<btns.length;i++){ btns[i].className = btns[i].getAttribute('data-tab') === name ? 'on' : ''; }
    var screens = ['stock', 'audit', 'log', 'stats', 'settings']; for(var j=0;j<screens.length;j++){ $('screen-' + screens[j]).style.display = (screens[j] === name) ? 'block' : 'none'; } window.scrollTo(0, 0);
  }

  function setSearch(v){ ui.q = v.toLowerCase().trim(); renderStock(); }
  function setSort(v){ ui.sort = v; renderStock(); }
  function setStatus(v){ ui.status = v; renderStock(); }
  function setCat(v){ ui.cat = v; renderStock(); }

  function toggleTheme(){ state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); }
  function applyTheme(){
    if(state.theme === 'dark'){ document.body.style.background = '#0b1220'; document.body.style.color = '#e2e8f0'; var h = $('themeBtn'); if(h) h.textContent = 'الوضع النهاري'; } 
    else { document.body.style.background = '#f1f5f9'; document.body.style.color = '#0f172a'; var h2 = $('themeBtn'); if(h2) h2.textContent = 'الوضع الليلي'; }
  }

  function setCurrency(v){ state.currency = v.trim() || 'ج.م'; save(); renderAll(); }
  function exportData(){ var data = JSON.stringify(state, null, 2); var blob = new Blob([data], { type: 'application/json' }); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inventory-' + new Date().toISOString().slice(0,10) + '.json'; a.click(); toast('تم التصدير'); }
  function importFile(inp){
    var file = inp.files[0]; if(!file) return; var r = new FileReader();
    r.onload = function(){ try { var d = JSON.parse(r.result); if(!d || !Array.isArray(d.items)) throw new Error('bad'); if(!confirm('استبدال البيانات الحالية؟')) return; state.items = d.items; state.log = Array.isArray(d.log) ? d.log : []; state.currency = d.currency || 'ج.م'; audit = {}; save(); renderAll(); toast('تم الاستيراد'); } catch(e){ toast('ملف غير صالح'); } };
    r.readAsText(file); inp.value = '';
  }
  function clearLog(){ if(!confirm('تفريغ السجل بالكامل؟')) return; state.log = []; save(); renderAll(); toast('تم التفريغ'); }
  function clearAll(){ if(!confirm('حذف كل البيانات نهائياً؟')) return; if(!confirm('تأكيد أخير؟')) return; state.items = []; state.log = []; audit = {}; save(); renderAll(); toast('تم الحذف'); }

  return {
    boot: boot, tab: tab, setSearch: setSearch, setSort: setSort, setStatus: setStatus, setCat: setCat, setLogFilter: setLogFilter, toggleTheme: toggleTheme,
    newItem: newItem, saveItem: saveItem, editItem: editItem, updateItem: updateItem, openOp: openOp, doOp: doOp, openMenu: openMenu,
    quickAudit: quickAudit, doQuickAudit: doQuickAudit, deleteItem: deleteItem, closeModal: closeModal,
    auditInput: auditInput, auditReset: auditReset, auditFill: auditFill, auditApply: auditApply, undo: undo,
    setCurrency: setCurrency, exportData: exportData, importFile: importFile, clearLog: clearLog, clearAll: clearAll,
    checkForUpdates: checkForUpdates,
    connectSync: connectSync, disconnectSync: disconnectSync
  };
})();

try { App.boot(); document.getElementById('app').style.display = 'block'; } catch(e){ document.body.innerHTML = '<div style="padding:20px;background:#fee2e2;color:#991b1b;text-align:center;margin:20px"><b>خطأ:</b> ' + (e.message || e) + '</div>'; }
</script>
</body>
